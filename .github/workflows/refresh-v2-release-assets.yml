name: Refresh v2.0.0 release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-v2-release-assets.yml

permissions:
  contents: write

jobs:
  refresh-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixed main branch
        uses: actions/checkout@v4

      - name: Rebuild v2.0.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          gh release download v2.0.0 --dir release-assets

          cp autobuildffavs.sh release-assets/autobuildffavs.sh
          rm -f release-assets/SHA256SUMS.txt

          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum "$file"; done \
              > SHA256SUMS.txt
          )

          gh release upload v2.0.0 \
            release-assets/autobuildffavs.sh \
            release-assets/SHA256SUMS.txt \
            --clobber
